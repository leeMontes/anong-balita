<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c8c7cc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="description" content="Anong Balita? — a peer-to-peer walkie talkie and chat. Create a channel handle, share a QR, and talk push-to-talk." />
<title>Anong Balita?</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/ios.css" />
</head>
<body>
<div class="device">

  <div class="statusbar">
    <span class="sb-left"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="sb-carrier">BALITA</span></span>
    <span class="sb-clock" id="status-clock">--:--</span>
    <span class="sb-right"><span class="sb-pct">100%</span><span class="battery"><b></b></span></span>
  </div>

  <header class="navbar">
    <span class="nav-title">Anong Balita?</span>
  </header>

  <main class="app">

    <!-- ============================ RADIO ============================ -->
    <section id="view-radio" class="view">
      <div class="screen" id="screen-home">
        <div class="segmented mode-switch">
          <button type="button" data-mode="host" class="active">CREATE</button>
          <button type="button" data-mode="join">JOIN</button>
        </div>

        <div id="form-host" class="form">
          <div class="group">
            <div class="row">
              <label for="input-group-name">Balita Group</label>
              <input id="input-group-name" maxlength="24" placeholder="Tondo Patrol" autocomplete="off" />
            </div>
            <div class="row">
              <label for="input-handle">Channel Handle</label>
              <input id="input-handle" maxlength="32" placeholder="tondopatrol7" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" />
            </div>
            <div class="row">
              <label for="input-host-name">Your Name</label>
              <input id="input-host-name" maxlength="14" placeholder="Base-1" autocomplete="off" />
            </div>
          </div>
          <button type="button" id="btn-random" class="btn btn-plain">Randomize handle</button>
          <button type="button" id="btn-create" class="btn btn-blue">Broadcast</button>
        </div>

        <div id="form-join" class="form hidden">
          <div class="group">
            <div class="row">
              <label for="input-join-handle">Channel Handle</label>
              <input id="input-join-handle" maxlength="32" placeholder="tondopatrol7" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" />
            </div>
            <div class="row">
              <label for="input-join-name">Your Name</label>
              <input id="input-join-name" maxlength="14" placeholder="Unit-2" autocomplete="off" />
            </div>
          </div>
          <button type="button" id="btn-join" class="btn btn-blue">Tune In</button>
        </div>

        <p id="home-status" class="status-line">SELECT A CHANNEL...</p>
      </div>

      <div class="screen hidden" id="screen-channel">
        <div class="radio-body">
          <div class="radio-top">
            <div class="grille"></div>
            <div class="brand-mini">ANONG BALITA</div>
            <div class="knob"></div>
          </div>
          <div class="lcd">
            <div class="lcd-row"><span class="lcd-lbl">GRP</span><span id="chan-group" class="lcd-val">----</span></div>
            <div class="lcd-row"><span class="lcd-lbl">CH</span><span id="chan-handle" class="lcd-val lcd-frq">-----</span></div>
            <div class="lcd-row"><span class="lcd-lbl">OPS</span><span id="chan-count" class="lcd-val lcd-ops">1</span><span class="lcd-unit">CONNECTED</span></div>
          </div>
          <div class="leds">
            <span class="led" id="led-link">LINK</span>
            <span class="led" id="led-tx">TX</span>
            <span class="led" id="led-rx">RX</span>
          </div>
        </div>

        <div id="qr-wrap" class="group qr-wrap hidden">
          <div id="qr" class="qr-canvas"></div>
          <p class="qr-cap">SCAN TO TUNE IN</p>
        </div>

        <ul id="roster" class="roster group" aria-label="Connected units"></ul>

        <div class="vu">
          <span class="vu-label">SIG</span>
          <div id="vu-bars" class="vu-bars"></div>
        </div>

        <button type="button" id="ptt" class="ptt" aria-label="Push to talk">
          <span class="ptt-face">PUSH<br />TO TALK</span>
        </button>
        <button type="button" id="btn-leave" class="btn btn-leave hidden">End Channel</button>
      </div>
    </section>

    <!-- ============================= CHAT ============================= -->
    <section id="view-chat" class="view hidden">
      <ul id="chat-log" class="chat-log" aria-live="polite"></ul>
      <p id="chat-empty" class="chat-empty">Tune in to a channel to chat.</p>
      <div class="chat-bar">
        <input id="chat-input" class="chat-input" type="text" maxlength="500" placeholder="Tune in to chat" disabled autocomplete="off" />
        <button type="button" id="chat-send" class="chat-send" disabled>Send</button>
      </div>
    </section>

  </main>

  <nav class="tabbar">
    <button type="button" class="tab active" data-tab="radio"><span class="tab-ico">&#128225;</span>Radio</button>
    <button type="button" class="tab" data-tab="chat"><span class="tab-ico">&#128172;</span>Chat</button>
    <a class="tab" href="info.html"><span class="tab-ico">&#8505;</span>Info</a>
  </nav>

  <div class="home-indicator"></div>
</div>

<div id="audio-sink" style="display:none"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/qr.js"></script>
<script src="js/radio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
